<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Movie Ticket Booking System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-primary">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">CinePulse</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/movies">Movies</a>
                <a class="nav-link" href="/theatres">Theatres</a>
                <a class="nav-link" href="/bookings">My Bookings</a>
                <a class="nav-link" href="/feedback">Feedback</a>
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link" href="/register">Register</a>
                <a class="nav-link text-warning" href="/admin/login">Theatre Admin</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-4">Now Showing &amp; Featured</h1>
        <div class="row g-4" id="movie-grid">
            <div class="col-md-4" th:each="movie : ${movies}">
                <div class="card bg-navy text-light h-100 border-secondary">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${movie.title}">Movie Title</h5>
                        <p class="card-text text-secondary" th:text="${movie.genre} + ' • ' + ${movie.language}">Genre</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
