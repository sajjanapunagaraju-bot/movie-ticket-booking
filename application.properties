spring.application.name=OnlineMovieTicketBookingSystem
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Razorpay Payment Gateway
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_YourKeyIdHere}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YourKeySecretHere}

# Booking & Cancellation Rules
booking.max-seats=6
booking.cancellation-hours=4
booking.convenience-fee-pct=5.0
