<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theatre Management Login - CinePulse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-dark text-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 440px;">
        <div class="card bg-navy text-light p-4 border-warning">
            <h3 class="mb-2 text-warning">Theatre Management Portal</h3>
            <p class="small text-secondary">Use your assigned <strong>@movie.com</strong> management account.</p>
            <form method="post" action="/admin/login">
                <div class="mb-3">
                    <label class="form-label">Management Username (@movie.com)</label>
                    <input type="text" name="username" pattern=".+@movie\.com$" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-warning w-100">Management Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
